services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # EC2では .env で NUXT_SSR=false にしてhairpin NAT問題を回避する（PR #11参照）
        NUXT_SSR: ${NUXT_SSR:-true}
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://13.239.31.224:8000}
      NUXT_SSR: ${NUXT_SSR:-true}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
