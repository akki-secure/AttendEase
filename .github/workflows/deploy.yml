name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-2
  SECURITY_GROUP_ID: sg-018d4fd49f5c66f15

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get GitHub Actions runner IP
        id: ip
        run: echo "address=$(curl -s https://api.ipify.org)/32" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP to access SSH port temporarily
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.address }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd AttendEase
            git fetch origin
            git pull --ff-only origin main
            docker builder prune -af
            docker image prune -af
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps

      - name: Revoke temporary SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.address }}"
